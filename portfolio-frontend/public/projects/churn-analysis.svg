<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  
  <!-- Header -->
  <rect x="50" y="30" width="700" height="40" rx="8" fill="url(#cardGrad2)" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="80" cy="50" r="6" fill="#ffffff" fill-opacity="0.8"/>
  <text x="105" y="55" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Customer Retention & Survival Analysis</text>

  <!-- Left: Retention Cohort Decay curve -->
  <g transform="translate(50, 90)">
    <rect width="420" height="360" rx="14" fill="url(#cardGrad2)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="24" y="34" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600">Cohort Retention Curve</text>
    <text x="24" y="55" fill="#a3a3a3" font-family="Inter, sans-serif" font-size="11">Kaplan-Meier survival estimation across billing cycles</text>

    <!-- Axes -->
    <line x1="40" y1="310" x2="380" y2="310" stroke="#ffffff" stroke-opacity="0.2"/>
    <line x1="40" y1="100" x2="40" y2="310" stroke="#ffffff" stroke-opacity="0.2"/>

    <!-- Retention lines -->
    <!-- High Value Segment -->
    <path d="M 40 120 Q 120 130, 200 160 T 360 190" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Average Segment -->
    <path d="M 40 120 Q 120 180, 200 230 T 360 270" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-dasharray="4 4"/>
    
    <circle cx="360" cy="190" r="4" fill="#ffffff"/>
    <circle cx="360" cy="270" r="4" fill="#a3a3a3"/>
    
    <text x="270" y="175" fill="#ffffff" font-family="Inter, sans-serif" font-size="11">Annual Plan (72%)</text>
    <text x="270" y="255" fill="#a3a3a3" font-family="Inter, sans-serif" font-size="11">Monthly Plan (34%)</text>
  </g>

  <!-- Right: Feature Importance Breakdown -->
  <g transform="translate(490, 90)">
    <rect width="260" height="360" rx="14" fill="url(#cardGrad2)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="24" y="34" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600">Churn Drivers (SHAP)</text>
    <text x="24" y="55" fill="#a3a3a3" font-family="Inter, sans-serif" font-size="11">Key impact features</text>

    <!-- Feature 1 -->
    <text x="24" y="105" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="12">Contract Duration</text>
    <rect x="24" y="115" width="210" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="24" y="115" width="180" height="10" rx="5" fill="#ffffff" fill-opacity="0.85"/>

    <!-- Feature 2 -->
    <text x="24" y="160" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="12">Support Tickets Count</text>
    <rect x="24" y="170" width="210" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="24" y="170" width="145" height="10" rx="5" fill="#ffffff" fill-opacity="0.65"/>

    <!-- Feature 3 -->
    <text x="24" y="215" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="12">Monthly Charges</text>
    <rect x="24" y="225" width="210" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="24" y="225" width="115" height="10" rx="5" fill="#ffffff" fill-opacity="0.45"/>

    <!-- Feature 4 -->
    <text x="24" y="270" fill="#e5e5e5" font-family="Inter, sans-serif" font-size="12">Payment Method</text>
    <rect x="24" y="280" width="210" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="24" y="280" width="80" height="10" rx="5" fill="#ffffff" fill-opacity="0.3"/>
  </g>
</svg>
